<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ma Boutique</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🛍️ Ma Boutique</h1>

    <p>Bienvenue dans ma boutique en ligne</p>

    <!-- BARRE DE RECHERCHE -->
    <div class="recherche">
        <input
            type="text"
            id="recherche-produit"
            placeholder="🔎 Rechercher un produit..."
        >
    </div>

    <button id="btn-ajouter">
        ⚙️ Ajouter un produit
    </button>

    <div id="formulaire-produit" class="formulaire">

        <h2>➕ Nouveau produit</h2>

        <input
            type="text"
            id="nom-produit"
            placeholder="Nom du produit"
        >

        <input
            type="number"
            id="prix-produit"
            placeholder="Prix en FCFA"
        >

        <textarea
            id="description-produit"
            placeholder="Description du produit"
        ></textarea>

        <input
            type="file"
            id="image-produit"
            accept="image/*"
        >

        <button id="btn-enregistrer">
            ✅ Enregistrer le produit
        </button>

        <button id="btn-annuler">
            ❌ Annuler
        </button>

    </div>

    <h2>🛒 Nos produits</h2>

    <div id="liste-produits"></div>
    <div id="paiement" class="paiement">
    <h2>💳 Choisir un moyen de paiement</h2>

    <button class="moyen-paiement" data-paiement="tmoney">
        📱 T-Money
    </button>

    <button class="moyen-paiement" data-paiement="flooz">
        📱 Flooz
    </button>

    <button class="moyen-paiement" data-paiement="visa">
        💳 Visa
    </button>

    <button class="moyen-paiement" data-paiement="mastercard">
        💳 Mastercard
    </button>

    <button class="moyen-paiement" data-paiement="virement">
        🏦 Virement bancaire
    </button>

    <button class="moyen-paiement" data-paiement="livraison">
        💵 Paiement à la livraison
    </button>
</div>

    <script src="script.js"></script>

</body>

</html>
